<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6fa5" />
      <stop offset="100%" stop-color="#2d4974" />
    </linearGradient>
    <linearGradient id="ss-cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4e4f7" />
      <stop offset="100%" stop-color="#b1cde8" />
    </linearGradient>
    <linearGradient id="ss-cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="ss-cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Badge -->
  <rect width="32" height="32" rx="7" fill="url(#ss-bg)" />
  
  <!-- Isometric 3D Inventory Cube / Package -->
  <!-- Top Face -->
  <polygon points="16,6 25,11.2 16,16.4 7,11.2" fill="url(#ss-cube-top)" />
  <!-- Left Face -->
  <polygon points="7,11.2 16,16.4 16,26 7,20.8" fill="url(#ss-cube-left)" />
  <!-- Right Face -->
  <polygon points="16,16.4 25,11.2 25,20.8 16,26" fill="url(#ss-cube-right)" opacity="0.9" />
  
  <!-- Inner Seam Lines -->
  <line x1="16" y1="16.4" x2="16" y2="26" stroke="#4a6fa5" stroke-width="0.75" stroke-linecap="round" />
  <line x1="16" y1="16.4" x2="7" y2="11.2" stroke="#4a6fa5" stroke-width="0.75" stroke-linecap="round" />
  <line x1="16" y1="16.4" x2="25" y2="11.2" stroke="#4a6fa5" stroke-width="0.75" stroke-linecap="round" />

  <!-- Intelligent Pulse / Sensor Dot -->
  <circle cx="23.5" cy="8.5" r="2" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" />
</svg>

