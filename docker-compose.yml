services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/inventory_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg://user:password@db:5432/inventory_db
      SECRET_KEY: dev-secret-change-this-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
